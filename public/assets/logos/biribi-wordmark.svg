<svg width="160" height="32" viewBox="0 0 160 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Casino chip icon -->
  <g transform="translate(16, 16)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="12.5" stroke="white" stroke-width="1.5" fill="none"/>
    <!-- Edge notches — casino chip style -->
    <circle cx="0" cy="0" r="11" stroke="white" stroke-width="2.5" stroke-dasharray="3.5 5.25" stroke-dashoffset="1.75" fill="none"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="8.5" stroke="white" stroke-width="1.5" fill="none"/>
  </g>
  <!-- "biribi" text -->
  <text x="38" y="21" font-family="Inter, sans-serif" font-weight="600" font-size="20" fill="white" letter-spacing="-0.025em">biribi</text>
  <!-- ".net" text (smaller) -->
  <text x="102" y="21" font-family="Inter, sans-serif" font-weight="400" font-size="14" fill="white" letter-spacing="-0.025em">.net</text>
</svg>
